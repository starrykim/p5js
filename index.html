<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>P5.js_비주얼포트폴리오 과제 모음</title>

<style>
    .grid-container {
        display: grid;
        grid-template-columns: 1fr 1fr; /* 2열 */
        gap: 20px;
        width: 80%;
        margin: 40px auto;
    }

    .box {
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 10px;
        text-align: center;
        background: #fafafa;
    }

    .box img {
        width: 100%;       /* 박스 크기에 맞게 자동 조정 */
        height: auto;      /* GIF 품질 유지 */
        border-radius: 8px;
    }

    .caption {
        margin-top: 10px;
        font-size: 15px;
        font-weight: 500;
    }
</style>
</head>

<body>

<div class="grid-container">

    <div class="box">
        <img src="project1/sample1.png" alt="project1">
        <div class="caption">(과제 #1)</div>
    </div>

    <div class="box">
        <img src="project4/sample4.gif" alt="project4">
        <div class="caption">(과제 #4)</div>
    </div>

    <div class="box">
        <img src="project2/sample2.png" alt="project2">
        <div class="caption">(과제 #2)</div>
    </div>

    <div class="box">
        <img src="project3/sample3.gif" alt="project3">
        <div class="caption">(과제 #3)</div>
    </div>

</div>

</body>
</html>
